[workspace]
resolver = "2"
members = [
    "crates/scoreleap-music-ir",
    "crates/scoreleap-midi",
    "crates/scoreleap-arranger",
    "crates/scoreleap-sequence",
    "crates/scoreleap-game-profile",
    "crates/scoreleap-scheduler",
    "crates/scoreleap-transcription",
    "crates/scoreleap-audio",
    "crates/scoreleap-model-manager",
    "crates/scoreleap-transcribe",
    "crates/scoreleap-core",
    "plugins/tauri-plugin-scoreleap-input",
    "apps/scoreleap/src-tauri",
    "apps/scoreleap-transcriber-native",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "GPL-3.0"
authors = ["superdaobo"]
repository = "https://github.com/superdaobo/scoreleap"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
midly = "0.5"
symphonia = { version = "0.5", features = ["mp3", "wav", "flac", "pcm"] }
rubato = "0.16"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }
tempfile = "3"
# 运行时 DLL 由应用资源提供并在启动时显式加载，构建过程不从第三方 CDN 下载二进制。
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-24"] }
ndarray = "0.17"
tauri = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Media_Multimedia",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true

