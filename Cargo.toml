[workspace]
resolver = "2"
members = [
    "crates/scoreleap-music-ir",
    "crates/scoreleap-midi",
    "crates/scoreleap-arranger",
    "crates/scoreleap-sequence",
    "crates/scoreleap-game-profile",
    "crates/scoreleap-scheduler",
    "crates/scoreleap-core",
    "plugins/tauri-plugin-scoreleap-input",
    "apps/scoreleap/src-tauri",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "GPL-3.0"
authors = ["superdaobo"]
repository = "https://github.com/superdaobo/scoreleap"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
midly = "0.5"
tauri = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_Media_Multimedia",
    "Win32_System_Diagnostics_Debug",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true


