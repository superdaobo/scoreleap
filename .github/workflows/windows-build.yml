name: Windows Native Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/windows-build.yml"
      - "apps/scoreleap/**"
      - "apps/scoreleap-transcriber-native/**"
      - "crates/scoreleap-audio/**"
      - "crates/scoreleap-transcribe/**"
      - "crates/scoreleap-model-manager/**"
      - "tools/native-transcriber-packaging/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: windows-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Native sidecar, ONNX Runtime, NSIS and clean-install
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # 可选的自托管 runner 路径；未同时配置时只运行协议/缺模型 E2E。
      SCORELEAP_E2E_MODEL: ${{ vars.SCORELEAP_E2E_MODEL }}
      SCORELEAP_E2E_AUDIO: ${{ vars.SCORELEAP_E2E_AUDIO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: ONNX Runtime archive cache
        uses: actions/cache@v4
        with:
          path: .build-tmp/packaging-cache/onnxruntime-win-x64-1.24.4.zip
          key: onnxruntime-win-x64-1.24.4-d2319fddfb6ea4db99ccc4b60c85c517bcd855721f5daa6a06d40d7cb2ee2357

      - name: PowerShell syntax check (60 second limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 60 -Executable powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/check-powershell-syntax.ps1 scripts/invoke-with-timeout.ps1 scripts/check-powershell-syntax.ps1 tools/native-transcriber-packaging/Prepare-NativeTranscriber.ps1 tools/native-transcriber-packaging/Test-NativeTranscriberBundle.ps1 tools/native-transcriber-packaging/Invoke-NativeTranscriberE2E.ps1 tools/native-transcriber-packaging/Test-CleanInstall.ps1 tools/native-transcriber-packaging/Publish-WindowsArtifactMetadata.ps1 tools/native-transcriber-packaging/Test-PackagingSources.ps1

      - name: Packaging source contract check (60 second limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 60 -Executable powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/native-transcriber-packaging/Test-PackagingSources.ps1

      - name: Install frontend dependencies (5 minute limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 300 -Executable pnpm.cmd install --frozen-lockfile

      - name: Native format check (60 second limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 60 -Executable cargo.exe fmt --check

      - name: Native tests (60 second limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 60 -Executable cargo.exe test --locked -p scoreleap-transcribe -p scoreleap-transcriber-native

      - name: Frontend tests (60 second limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 60 -Executable pnpm.cmd test

      - name: Frontend build (3 minute limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 180 -Executable pnpm.cmd build

      - name: Build release native sidecar (10 minute limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 600 -Executable cargo.exe build --locked --release -p scoreleap-transcriber-native

      - name: Prepare verified native resources (5 minute limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 300 -Executable powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/native-transcriber-packaging/Prepare-NativeTranscriber.ps1 -SkipNativeBuild

      - name: Audit pre-bundle resources (60 second limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 60 -Executable powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/native-transcriber-packaging/Test-NativeTranscriberBundle.ps1 -ResourceDirectory apps/scoreleap/src-tauri/resources/scoreleap-transcriber

      - name: Native JSONL and optional real-audio E2E (60 second process limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/native-transcriber-packaging/Invoke-NativeTranscriberE2E.ps1 -SidecarPath apps/scoreleap/src-tauri/resources/scoreleap-transcriber/scoreleap-transcriber-native.exe -RuntimeDirectory apps/scoreleap/src-tauri/resources/scoreleap-transcriber -TimeoutSeconds 60

      - name: Build NSIS installer (15 minute limit)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/invoke-with-timeout.ps1 -TimeoutSeconds 900 -Executable pnpm.cmd tauri build --bundles nsis

      - name: Locate installer and compute SHA256
        id: artifact
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/native-transcriber-packaging/Publish-WindowsArtifactMetadata.ps1

      - name: Clean-install, content audit and E2E (60 second process limits)
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/native-transcriber-packaging/Test-CleanInstall.ps1 -InstallerPath "${{ steps.artifact.outputs.installer_path }}" -InstallTimeoutSeconds 60 -TranscriptionTimeoutSeconds 60

      - name: Upload installer and reports
        uses: actions/upload-artifact@v4
        with:
          name: scoreleap-windows-native-installer
          path: |
            target/release/bundle/nsis/*.exe
            apps/scoreleap/src-tauri/target/release/bundle/nsis/*.exe
            scoreleap-windows-installer.sha256
            .build-tmp/native-e2e/**/*.json
            .build-tmp/native-e2e-installed/**/*.json
          if-no-files-found: error
