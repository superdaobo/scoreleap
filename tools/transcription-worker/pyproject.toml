[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreleap-transcriber"
version = "0.1.0"
description = "ScoreLeap 本地音频转录 Worker（Basic Pitch）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
dependencies = [
    "basic-pitch>=0.4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scoreleap-transcriber = "scoreleap_transcriber.cli:main"

[tool.setuptools.packages.find]
include = ["scoreleap_transcriber*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
