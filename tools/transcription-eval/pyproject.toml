[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scoreleap-transcription-eval"
version = "0.1.0"
description = "ScoreLeap MIDI transcription quality harness"
requires-python = ">=3.10"
dependencies = [
  "mido==1.3.3",
  "numpy==2.2.6",
]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
scoreleap-transcription-eval = "scoreleap_transcription_eval.cli:main"

[tool.setuptools.packages.find]
include = ["scoreleap_transcription_eval*"]
