[package]
name = "tauri-plugin-scoreleap-input"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ScoreLeap input backends: Windows SendInput (desktop) / Kotlin gestures (mobile, v0.2)"

[lib]
name = "tauri_plugin_scoreleap_input"
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
scoreleap-music-ir = { path = "../../crates/scoreleap-music-ir" }
scoreleap-scheduler = { path = "../../crates/scoreleap-scheduler" }
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
tauri = { workspace = true, features = [] }
